<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista Firm</title>
</head>

<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f9;
        margin: 0;
        padding: 0;
    }

    .container {
        width: 90%;
        max-width: 1200px;
        margin: 20px auto;
        padding: 20px;
    }

    h1 {
        text-align: center;
        margin-bottom: 20px;
        color: #333;
    }

    /* --- NOWE STYLE DLA WYSZUKIWARKI --- */
    .search-wrapper {
        display: flex;
        justify-content: center;
        margin-bottom: 30px;
    }

    #search-input {
        width: 100%;
        max-width: 500px;
        padding: 12px 20px;
        border: 1px solid #ddd;
        border-radius: 25px; /* Zaokrąglone rogi */
        font-size: 16px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        outline: none;
        transition: box-shadow 0.3s ease;
    }

    #search-input:focus {
        box-shadow: 0 4px 10px rgba(125, 42, 232, 0.2); /* Fioletowa poświata pasująca do przycisków */
        border-color: #7d2ae8;
    }
    /* ----------------------------------- */

    .card {
        display: flex;
        flex-direction: column;
        background: #fff;
        margin-bottom: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        padding: 20px;
        transition: transform 0.2s;
    }

    .card:hover {
        transform: scale(1.02);
    }

    .card-content {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .card-content span {
        font-size: 16px;
        color: #555;
    }

    .card-title {
        font-size: 20px;
        font-weight: bold;
        margin-bottom: 10px;
        color: #333;
    }

    .card-footer {
        display: flex;
        justify-content: flex-end;
    }

    .card-button {
        background-color: #7d2ae8;
        color: #fff;
        border: none;
        padding: 10px 20px;
        border-radius: 5px;
        text-decoration: none;
        font-size: 14px;
        transition: background-color 0.2s;
    }

    .card-button:hover {
        background-color: #5a1bb8;
    }

    /* Styl dla komunikatu "Brak wyników" */
    #no-results {
        text-align: center;
        color: #777;
        font-size: 18px;
        display: none; /* Domyślnie ukryty */
        margin-top: 20px;
    }
</style>

<body>
<div class="container">
    <h1>Lista Firm</h1>

    <div class="search-wrapper">
        <input type="text" id="search-input" placeholder="Wyszukaj firmę po nazwie...">
    </div>

    <div id="companies-list">
        <div class="card" th:each="company : ${companies}">
            <div class="card-content">
                <span class="card-title company-name" th:text="${company.name}"></span>

                <span th:text="${company.contactEmail}"></span>
                <span th:text="${company.contactPhone}"></span>
                <span th:text="${company.address}"></span>
            </div>
            <div class="card-footer">
                <a th:href="${company.website}" target="_blank" class="card-button">Zobacz Ofertę</a>
            </div>
        </div>
    </div>

    <div id="no-results">Nie znaleziono firmy o takiej nazwie.</div>

</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const searchInput = document.getElementById('search-input');
        const cards = document.querySelectorAll('.card');
        const noResultsMsg = document.getElementById('no-results');

        searchInput.addEventListener('keyup', function(event) {
            const query = event.target.value.toLowerCase();
            let visibleCount = 0;

            cards.forEach(card => {
                // Pobieramy nazwę firmy z konkretnej karty
                const title = card.querySelector('.company-name').textContent.toLowerCase();

                // Sprawdzamy czy wpisany tekst znajduje się w nazwie
                if (title.includes(query)) {
                    card.style.display = ""; // Pokaż (domyślny styl, zazwyczaj flex/block)
                    visibleCount++;
                } else {
                    card.style.display = "none"; // Ukryj
                }
            });

            // Obsługa komunikatu "Brak wyników"
            if (visibleCount === 0) {
                noResultsMsg.style.display = "block";
            } else {
                noResultsMsg.style.display = "none";
            }
        });
    });
</script>

</body>
</html>
